{% extends 'incos_app/base.html' %}
{% block title %}Crear Reserva{% endblock %}
{% block header %}Crear Nueva Reserva{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                Detalles de la Reserva
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form.as_p }} 

                    <button type="submit" class="btn btn-success mt-3">Confirmar Reserva</button>
                    <a href="{% url 'reserva_list' %}" class="btn btn-secondary mt-3">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
