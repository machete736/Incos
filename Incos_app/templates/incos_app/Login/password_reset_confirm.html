<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Establecer Nueva Contraseña</title>
</head>
<body>
    {% if validlink %}
        <h1>Establecer Nueva Contraseña</h1>
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Cambiar Contraseña</button>
        </form>
    {% else %}
        <h1>Enlace Inválido</h1>
        <p>El enlace de restablecimiento es inválido, posiblemente porque ya se usó. Por favor, solicita un nuevo restablecimiento.</p>
        <p><a href="{% url 'password_reset' %}">Solicitar nuevo enlace</a></p>
    {% endif %}
</body>
</html>
